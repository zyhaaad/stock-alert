name: stock-monitor

# 交易时段（北京时间 9:30-11:30、13:00-15:00）每 5 分钟检查一次。
# cron 用 UTC：北京 9:30-15:00 ≈ UTC 1:30-7:00，脚本内部还会再精确判断一次（含午休）。
on:
  schedule:
    - cron: '*/5 1-7 * * 1-5'
  workflow_dispatch:
    inputs:
      simulate:
        description: '测试运行（忽略交易时段、不推送，只更新状态）'
        type: boolean
        default: false

permissions:
  contents: write

# 防止上一次还没跑完下一次又启动，造成状态覆盖
concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run monitor
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: node alert.js ${{ github.event.inputs.simulate == 'true' && '--simulate' || '' }}

      # 把运行状态（是否已提醒过、首次触发价）提交回仓库：
      # 既实现"条件满足只提醒一次不刷屏"，也为控制台的删除记录提供触发价存档。
      # 注意：state.json 首次是"未跟踪文件"，git diff 检测不到，必须先 git add 再比对。
      - name: Save state
        run: |
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: update state [skip ci]"
              git push
            fi
          fi
