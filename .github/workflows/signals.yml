name: signals-daily

# 每日信号任务（收盘后）：
#   1. signals.js  —— 持仓/监控的买卖信号（有新信号才推一条，合并成一条消息）
#   2. screener.js —— 每日备选池（用户要求：**不推送**，只写进备选池记录，控制台可看）
#   3. chips.js    —— 透视存档（筹码分布 + 主力/散户成本 + 行为判定 + 站队结论，**不推送**）
#   4. review.js   —— 每周五的规则体检（各规则胜率/样本数/调整建议；非周五自动跳过）
#
#   ⚠️ style.js（大盘风格驾驶舱）已于 2026-09-21 迁出到独立的 style.yml，
#      不再挂在这里：一是这里 16:05 才跑、太晚；二是它会挡在本 workflow 的
#      存档提交前面，上游失败会导致风格当天不更新。
#
# 胜负口径（用户 2026-09-16 指定）：信号后 10 个交易日 ±2%。
# 存档：signals-history.json（信号+胜负）、picks-history.json（备选池）、
#       chips-history.json（透视）。style-history.json（风格）归 style.yml 提交。
#
# cron 用 UTC：北京 16:05 = UTC 8:05（收盘后日线已定型）
on:
  schedule:
    - cron: '5 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signals-daily
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Holdings & monitor signals
        run: node signals.js
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}

      - name: Daily picks (archive only, no push)
        run: node screener.js

      # 透视存档（★ 2026-09-17 用户需求）：筹码分布 + 主力/散户成本 + 行为判定 + 站队结论
      # 放在 screener 之后 —— 这样当天新选出来的备选股也会一起算进去。
      # 必须放云端的原因：资金流接口在手机浏览器上不保证跨域，且算一次可给所有设备共用。
      - name: Chip perspective (archive only, no push)
        run: node chips.js

      # 大盘风格驾驶舱已于 2026-09-21 迁到独立 workflow style.yml（收盘即跑 15:05 + 定稿 15:40），
      # 这里不要再跑一遍 —— 同一天两处写 style-history.json 会互相覆盖。

      - name: Weekly rule review (Friday only)
        run: node review.js
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}

      # 存档都是新文件时必须先 git add（git diff 才检测得到），与 fng-history.json 同理
      - name: Commit archives
        run: |
          git add signals-history.json picks-history.json chips-history.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update signals & picks archive [skip ci]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push || (sleep 5 && git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push)
          else
            echo "存档无变化"
          fi
