name: signals-daily

# 每日信号任务（收盘后）：
#   1. signals.js  —— 持仓/监控的买卖信号（有新信号才推一条，合并成一条消息）
#   2. screener.js —— 每日备选池（用户要求：**不推送**，只写进备选池记录，控制台可看）
#   3. review.js   —— 每周五的规则体检（各规则胜率/样本数/调整建议；非周五自动跳过）
#
# 胜负口径（用户 2026-09-16 指定）：信号后 10 个交易日 ±2%。
# 存档：signals-history.json（信号+胜负）、picks-history.json（备选池）——内容没变不提交。
#
# cron 用 UTC：北京 16:05 = UTC 8:05（收盘后日线已定型）
on:
  schedule:
    - cron: '5 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signals-daily
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Holdings & monitor signals
        run: node signals.js
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}

      - name: Daily picks (archive only, no push)
        run: node screener.js

      - name: Weekly rule review (Friday only)
        run: node review.js
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}

      # 两个存档都是新文件时必须先 git add（git diff 才检测得到），与 fng-history.json 同理
      - name: Commit archives
        run: |
          git add signals-history.json picks-history.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update signals & picks archive [skip ci]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push || (sleep 5 && git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push)
          else
            echo "存档无变化"
          fi
