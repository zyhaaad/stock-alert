name: rotation-daily

# 板块轮动状态日更存档：每交易日收盘后跑一次，把全市场板块（一级行业 / 二级行业 / 概念 / 新概念）
# 的**轮动八态**算出来写进 rotation.json，供控制台「板块轮动」页 + 「当前市场主线」页直读。
# 数据源=同花顺板块日线（东财 push2 系间歇性 UND_ERR_SOCKET，不可作主口径）。
#
# cron 用 UTC：北京 19:30 = UTC 11:30
# ⚠️ 时间不是拍的：最初定在北京 17:30（UTC 9:30），但 2026-10-09 那次跑出来
#   594 个板块里只有 277 个拿到当日日线、dropped=315 —— 同花顺各板块的年度文件
#   **更新不是同一时刻完成**，17:30 时还有一半以上没刷新。推迟到 19:30 再抓。
#   与 fng 16:05 / flow 16:10 / style 15:40 错开。
# ⚠️ 非交易日（A 股节假日）在这里是**照常触发**的：cron 的 1-5 只认工作日。
#    脚本内有交易日闸门（trade-day.js）→ 非交易日打印一行后直接退出、不写盘、不产生 commit。
on:
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotation-daily
  cancel-in-progress: false

jobs:
  rotation:
    runs-on: ubuntu-latest
    # 稳态 594 板块 × 2 个年度文件 ≈ 1200 个请求（约 3~6 分钟）；
    # 首次或遇 504 限流走指数退避，给足预算。脚本内另有 60% 成功率闸门，不达标不写盘。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update sector rotation archive
        run: node rotation.js

      - name: Commit archive
        run: |
          # 首次运行前 rotation.json 还不存在；非交易日被闸门拦截、或成功率 <60% 不写盘时也不会生成。
          # 这两种情况都要**干净退出**（否则 git add 报 pathspec 不匹配 → 整个 job 判失败，
          # 把"正常跳过"显示成"出错"，会误导排查）。
          if [ ! -f rotation.json ]; then
            echo "本次未生成存档（非交易日 / 成功率不足 / 首次运行），跳过提交"
            exit 0
          fi
          git add rotation.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update sector rotation archive [skip ci]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push || (sleep 5 && git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push)
          else
            echo "存档无变化"
          fi
